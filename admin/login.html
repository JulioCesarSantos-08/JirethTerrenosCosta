<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Administrativo | Jireth Terrenos de la Costa</title>

    <link rel="icon" href="../imagenes/logo1.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="overlay"></div>

    <main class="loginContainer">

        <div class="loginCard">

            <img
                src="../imagenes/logo1.png"
                class="logo">

            <span class="panelTexto">

                PANEL ADMINISTRATIVO

            </span>

            <h1>

                Jireth Terrenos de la Costa

            </h1>

            <p>

                Accede con tu cuenta autorizada para administrar terrenos, publicaciones y configuraciones.

            </p>

            <form id="formLogin">

                <div class="grupo">

                    <label>

                        Correo electrónico

                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email">

                </div>

                <div class="grupo">

                    <label>

                        Contraseña

                    </label>

                    <div class="passwordBox">

                        <input
                            type="password"
                            id="password"
                            placeholder="********">

                        <button
                            type="button"
                            id="btnMostrar">

                            👁

                        </button>

                    </div>

                </div>

                <button
                    class="btnLogin"
                    type="submit">

                    Iniciar sesión

                </button>

            </form>

            <button
                id="btnRecuperar"
                class="link">

                ¿Olvidaste tu contraseña?

            </button>

            <div id="mensaje"></div>

        </div>

    </main>

    <script type="module" src="js/login.js"></script>

</body>

</html>
